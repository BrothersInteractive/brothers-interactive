# Netlify hosting config for brothersinteractive.in (repo: BrothersInteractive/brothers-interactive, branch: main).
# Netlify rebuilds automatically on every push to main — including every "Publish" in /admin.

[build]
  publish = "."

# Homepage lives in /html/ — send the bare domain there.
[[redirects]]
  from = "/"
  to = "/html/index.html"
  status = 301
  force = true

# Friendly short links
[[redirects]]
  from = "/contact"
  to = "/html/contact.html"
  status = 301
[[redirects]]
  from = "/breakdowns"
  to = "/html/breakdown.html"
  status = 301
[[redirects]]
  from = "/careers"
  to = "/html/index.html#careers"
  status = 301

# Anything that doesn't exist
[[redirects]]
  from = "/*"
  to = "/html/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Images/models/videos: cached for a week (not "forever"), so a file replaced via /admin
# under the same name still updates for visitors. CSS/JS are versioned with ?v= tags.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Content edited in /admin must show on the next refresh.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"
