<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager — Brothers Interactive</title>
  <link rel="icon" href="/assets/img/brand/favicon.png" />
  <meta name="robots" content="noindex" />
</head>
<body>
  <!-- Sveltia CMS: reads the same config.yml Decap CMS used. Login = "Sign In with Token"
       (a GitHub personal access token for BrothersInteractive/brothers-interactive), so no OAuth
       helper is needed on GitHub Pages. On localhost in Chrome/Edge, "Work with Local Repository"
       edits the files in this folder directly. -->
  <!-- Old /admin addresses (bookmarks, open tabs) from before the pieces got their own section on
       3 Oct 2026: send them to the new place instead of an empty "Creating Portfolio" form -->
  <script>
    (function () {
      if (location.hash.indexOf("#/collections/portfolio/entries/pieces") === 0) location.replace(location.pathname + "#/collections/pieces");
    })();
    // Night view by default (Arun, 4 Oct 2026): set once per browser, so a theme picked later in the admin's
    // own Settings (account menu > Settings > Appearance) is kept from then on.
    (function () {
      try {
        if (localStorage.getItem("bi-admin-night")) return;
        var k = "sveltia-cms.prefs", p = JSON.parse(localStorage.getItem(k) || "{}") || {};
        p.theme = "dark"; localStorage.setItem(k, JSON.stringify(p)); localStorage.setItem("bi-admin-night", "1");
      } catch (e) {}
    })();
  </script>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <!-- The crop helper is a separate page; this button keeps it one click away from every admin screen -->
  <a href="/admin/focus.html" target="_blank" rel="noopener" style="position:fixed;left:14px;bottom:14px;z-index:9999;padding:9px 16px;border-radius:999px;background:#d4af37;color:#160f00;font:600 13px/1 system-ui,'Segoe UI',sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35)">Collage crop helper &#8599;</a>
</body>
</html>
