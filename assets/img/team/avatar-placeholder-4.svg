    <path d="M98 168c-12-60 14-108 62-112 46-4 74 30 70 86-1 14-6 26-12 36 0-30-6-52-18-62-12 8-28 8-40 2-14 8-32 6-44-2-10 12-16 30-18 52z" fill="#10131b"/>
