    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4357"/><stop offset=".45" stop-color="#262d3d"/><stop offset="1" stop-color="#121621"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="#4a5368"/><stop offset=".5" stop-color="#2d3445"/><stop offset="1" stop-color="#151a25"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset=".7" stop-color="#d4af37" stop-opacity="0"/><stop offset="1" stop-color="#e8c868" stop-opacity=".75"/></linearGradient>
